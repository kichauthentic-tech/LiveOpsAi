name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 22 để khớp `engines.node` trong package.json — trước đây CI chạy 20 trong khi
          # package.json khai 22.x, tức CI xanh không bảo đảm gì cho môi trường chạy thật.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `lint` từ 2026-09-24 là ESLint thật (trước đó chỉ là alias của tsc), `typecheck` mới là tsc.
      # Hai bước tách ra để đọc log biết ngay hỏng ở đâu.
      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (vitest)
        run: npm test

      - name: Build (client + server bundle)
        run: npm run build
        env:
          # Dummy values so Vite/esbuild can complete the build step in CI —
          # this job only verifies the code compiles, it does not deploy or run against real services.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
