name: Backup Supabase Database

on:
  schedule:
    # 03:00 UTC daily (~10:00 sáng giờ Việt Nam)
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Sao lưu ĐẦY ĐỦ (gồm dòng thô brand_dataraw_rows ~90 MB egress)"
        type: boolean
        default: false

jobs:
  backup:
    name: pg_dump → artifact
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client 17 (matches Supabase's Postgres 17 server)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Secret SUPABASE_DB_URL chưa được cấu hình — xem hướng dẫn ở .github/workflows/backup-supabase.yml"
            exit 1
          fi
          mkdir -p backup
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          # Egress (22/11): pg_dump kéo dữ liệu CHƯA NÉN qua pooler — trọn DB ≈ 90–100 MB/lần, trong đó ~89 MB là
          # brand_dataraw_rows (dòng thô file tải lên; file gốc vẫn tải lại được từ sàn). Gói Free chỉ 5 GB/tháng ⇒ dump trọn
          # mỗi ngày ăn ~50–60% egress. Ngày thường: bỏ DỮ LIỆU bảng đó (giữ cấu trúc); Chủ nhật hoặc chạy tay "full": trọn.
          EXCLUDE="--exclude-table-data=public.brand_dataraw_rows"
          KIND=lite
          if [ "$(date -u +%u)" = "7" ] || [ "${{ inputs.full }}" = "true" ]; then EXCLUDE=""; KIND=full; fi
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --no-owner --no-acl --format=custom $EXCLUDE --file="backup/liveopsai-${STAMP}-${KIND}.dump"
          echo "STAMP=${STAMP}-${KIND}" >> "$GITHUB_ENV"

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ env.STAMP }}
          path: backup/*.dump
          retention-days: 30

# ---
# Cách kích hoạt (cần user tự làm — DB password không được nhập hộ qua Claude Code):
#
# 1. Lấy connection string từ Supabase Dashboard: Project Settings > Database >
#    Connection string > mục "URI", chọn chế độ "Session pooler" (KHÔNG dùng
#    "Direct connection" — địa chỉ đó giờ chỉ có IPv6, mà GitHub Actions runner
#    không có kết nối mạng ra ngoài qua IPv6 nên sẽ báo lỗi "Network is
#    unreachable". Cũng KHÔNG dùng "Transaction pooler" (port 6543) — chế độ đó
#    không tương thích với pg_dump. Chỉ "Session pooler" vừa có IPv4 vừa hoạt
#    động đúng với pg_dump.)
#    Dạng: postgresql://postgres.<project-ref>:[YOUR-PASSWORD]@aws-0-<region>.pooler.supabase.com:5432/postgres
#
# 2. Vào GitHub repo > Settings > Secrets and variables > Actions > New repository secret
#    Tên: SUPABASE_DB_URL
#    Giá trị: connection string ở bước 1 (đã điền mật khẩu thật)
#
# 3. Workflow tự chạy hằng ngày 03:00 UTC, hoặc vào tab Actions > "Backup Supabase
#    Database" > "Run workflow" để chạy tay ngay (tick "full" để gồm dòng thô).
#    Ngày thường = bản "lite" (không có dữ liệu brand_dataraw_rows); Chủ nhật = "full".
#    Phục hồi: pg_restore bản full gần nhất, rồi bản lite mới hơn (bản lite không đụng
#    dữ liệu brand_dataraw_rows — đợt tải lên sau bản full thì tải lại file ở Dữ Liệu Gốc).
#
# 4. File .dump tải về qua tab Actions > chọn run > phần Artifacts. Phục hồi bằng:
#    pg_restore --clean --no-owner --dbname="<connection-string-đích>" liveopsai-<timestamp>.dump
#
# Lưu ý: artifact GitHub tự xóa sau 30 ngày (đã set retention-days ở trên) — đây
# là backup ngắn hạn/tiện lợi, không thay thế Point-in-Time Recovery của Supabase
# (chỉ có ở gói Pro trở lên) nếu cần khôi phục về đúng thời điểm bất kỳ trong quá khứ.
