name: Backup Supabase Database

on:
  schedule:
    # 03:00 UTC daily (~10:00 sáng giờ Việt Nam)
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    name: pg_dump → artifact
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Secret SUPABASE_DB_URL chưa được cấu hình — xem hướng dẫn ở .github/workflows/backup-supabase.yml"
            exit 1
          fi
          mkdir -p backup
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          pg_dump "$SUPABASE_DB_URL" --no-owner --no-acl --format=custom --file="backup/liveopsai-${STAMP}.dump"
          echo "STAMP=${STAMP}" >> "$GITHUB_ENV"

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ env.STAMP }}
          path: backup/*.dump
          retention-days: 30

# ---
# Cách kích hoạt (cần user tự làm — DB password không được nhập hộ qua Claude Code):
#
# 1. Lấy connection string từ Supabase Dashboard: Project Settings > Database >
#    Connection string > mục "URI", chọn chế độ "Session pooler" (KHÔNG dùng
#    "Direct connection" — địa chỉ đó giờ chỉ có IPv6, mà GitHub Actions runner
#    không có kết nối mạng ra ngoài qua IPv6 nên sẽ báo lỗi "Network is
#    unreachable". Cũng KHÔNG dùng "Transaction pooler" (port 6543) — chế độ đó
#    không tương thích với pg_dump. Chỉ "Session pooler" vừa có IPv4 vừa hoạt
#    động đúng với pg_dump.)
#    Dạng: postgresql://postgres.<project-ref>:[YOUR-PASSWORD]@aws-0-<region>.pooler.supabase.com:5432/postgres
#
# 2. Vào GitHub repo > Settings > Secrets and variables > Actions > New repository secret
#    Tên: SUPABASE_DB_URL
#    Giá trị: connection string ở bước 1 (đã điền mật khẩu thật)
#
# 3. Workflow tự chạy hằng ngày 03:00 UTC, hoặc vào tab Actions > "Backup Supabase
#    Database" > "Run workflow" để chạy tay ngay.
#
# 4. File .dump tải về qua tab Actions > chọn run > phần Artifacts. Phục hồi bằng:
#    pg_restore --clean --no-owner --dbname="<connection-string-đích>" liveopsai-<timestamp>.dump
#
# Lưu ý: artifact GitHub tự xóa sau 30 ngày (đã set retention-days ở trên) — đây
# là backup ngắn hạn/tiện lợi, không thay thế Point-in-Time Recovery của Supabase
# (chỉ có ở gói Pro trở lên) nếu cần khôi phục về đúng thời điểm bất kỳ trong quá khứ.
